[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sloty"
version = "0.1.0"
description = "Adversarial Evaluation & Regression Testing for Autonomous Scheduling Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
sloty = "sloty.cli:main"

[tool.setuptools.packages.find]
where = ["."]
